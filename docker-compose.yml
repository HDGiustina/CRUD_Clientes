services:
  db:
    image: postgres:16
    container_name: clientes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nogle
    ports:
      - "5432:5432"
    volumes:
      - clientes-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nogle"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  clientes-pgdata:
