    <script>
      // Aplica o tema antes da primeira pintura (sem clarão): salvo > sistema.
      try {
        var t = localStorage.getItem('clientes-tema');
        if (t !== 'claro' && t !== 'escuro') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        }
        if (t === 'escuro') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>

    <div id="root"></div>
